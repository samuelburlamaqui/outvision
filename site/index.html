<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f6f9">
<meta name="color-scheme" content="light">
<title>radar de obras</title>
<link rel="icon" href="icone.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icone.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="app.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></symbol>
  <symbol id="i-predio" viewBox="0 0 24 24"><path d="M5 21V4h14v17M3 21h18M9 8h2M13 8h2M9 12h2M13 12h2M9 16h2M13 16h2"/></symbol>
  <symbol id="i-loja" viewBox="0 0 24 24"><path d="M4 4h16l1 5H3l1-5zM3 9c0 1.7 1.3 3 3 3s3-1.3 3-3c0 1.7 1.3 3 3 3s3-1.3 3-3c0 1.7 1.3 3 3 3s3-1.3 3-3M5 12v9h14v-9M10 21v-5h4v5"/></symbol>
  <symbol id="i-galpao" viewBox="0 0 24 24"><path d="M3 21V10l9-6 9 6v11M2 21h20M7 21v-7h10v7M7 17.5h10"/></symbol>
  <symbol id="i-casa" viewBox="0 0 24 24"><path d="M3 11l9-7 9 7M5 9.5V21h14V9.5M10 21v-6h4v6"/></symbol>
  <symbol id="i-conjunto" viewBox="0 0 24 24"><path d="M1.5 12L7 7.5l5.5 4.5M3 11v9.5h8V11M11.5 12L17 7.5l5.5 4.5M13 11v9.5h8V11"/></symbol>
  <symbol id="i-garagem" viewBox="0 0 24 24"><path d="M4 21V5a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v16M9.5 17V8h3a2.5 2.5 0 0 1 0 5h-3"/></symbol>
  <symbol id="i-mapa" viewBox="0 0 24 24"><path d="M9 4L3 6.5v13.5l6-2.5 6 2.5 6-2.5V4l-6 2.5L9 4zM9 4v13.5M15 6.5V20"/></symbol>
  <symbol id="i-fechar" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
  <symbol id="i-lista" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></symbol>
  <symbol id="i-fichas" viewBox="0 0 24 24"><rect x="3" y="3" width="7.5" height="7.5" rx="1.5"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="1.5"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="1.5"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="1.5"/></symbol>
</svg>

<!-- Entrada -->
<section class="entrada" id="tela-entrada" hidden>
  <div class="caixa">
    <div class="marca"><img src="icone.svg" alt=""><span class="nome"><b>radar</b> de obras</span></div>
    <form id="form-entrada" autocomplete="on">
      <h1>Entrar</h1>
      <div class="campo"><label for="email">E-mail</label><input id="email" type="email" autocomplete="username" required></div>
      <div class="campo"><label for="senha">Senha</label><input id="senha" type="password" autocomplete="current-password" required></div>
      <div class="aviso erro" id="erro-entrada" hidden></div>
      <button class="btn primario" type="submit" id="btn-entrar">Entrar</button>
      <p>Esqueceu a senha? Peça ao administrador para criar uma nova.</p>
    </form>
  </div>
</section>

<!-- Mensagens de carregamento e erro geral -->
<section class="entrada" id="tela-msg">
  <div class="caixa">
    <!-- ícone animado: o ponteiro varre a tela e a obra "acende" quando ele passa -->
    <div class="marca"><svg class="radar-anim" viewBox="0 0 512 512" aria-hidden="true">
      <defs><linearGradient id="rastro" gradientUnits="userSpaceOnUse" x1="150.6" y1="130.4" x2="390.3" y2="161.9">
        <stop offset="0" stop-color="#161C2D" stop-opacity="0"/><stop offset="1" stop-color="#161C2D" stop-opacity="0.45"/></linearGradient></defs>
      <rect width="512" height="512" rx="116" fill="#E9A93C"/>
      <circle cx="256" cy="256" r="86" fill="none" stroke="#161C2D" stroke-width="16"/>
      <circle cx="256" cy="256" r="178" fill="none" stroke="#161C2D" stroke-width="28"/>
      <g class="varredura">
        <path d="M 256 256 L 150.6 130.4 A 164.0 164.0 0 0 1 390.3 161.9 Z" fill="url(#rastro)"/>
        <path d="M 256 256 L 390.3 161.9" stroke="#161C2D" stroke-width="18" stroke-linecap="round"/>
      </g>
      <circle class="ping" cx="284.8" cy="131.3" r="24" fill="none" stroke="#161C2D" stroke-width="7"/>
      <rect class="blip" x="262.8" y="109.3" width="44" height="44" rx="9" fill="#161C2D"/>
      <circle cx="256" cy="256" r="24" fill="#161C2D"/>
    </svg><span class="nome"><b>radar</b> de obras</span></div>
    <p id="msg-texto">Carregando…</p>
  </div>
</section>

<!-- App -->
<div id="tela-app" hidden>
  <header class="topo">
    <div class="dentro">
      <div class="lado">
        <a class="marca" href="#" aria-label="radar de obras — início"><img src="icone.svg" alt=""><span class="nome" aria-hidden="true"><b>radar</b> de obras</span></a>
        <span class="regiao">Pará</span>
      </div>
      <nav class="abas" id="abas" aria-label="Seções"></nav>
      <div class="usuario"><span>Olá, <b id="eu-nome"></b></span>
        <button class="btn discreto" type="button" id="btn-senha">Trocar senha</button>
        <button class="btn discreto" type="button" id="btn-sair">Sair</button>
      </div>
    </div>
  </header>
  <main class="wrap" id="conteudo" style="padding-top:18px"></main>
</div>

<dialog class="detalhe lateral" id="detalhe" aria-label="Detalhes da obra"></dialog>
<dialog class="detalhe" id="dlg-senha">
  <form method="dialog" id="form-senha">
    <div class="cab-dialog"><h3>Trocar senha</h3><button class="btn discreto" value="cancelar" type="submit" aria-label="Fechar"><svg class="ico"><use href="#i-fechar"/></svg></button></div>
    <div class="conteudo">
      <div class="campo"><label for="nova-senha">Nova senha (mínimo 8 caracteres)</label><input id="nova-senha" type="password" minlength="8" autocomplete="new-password"></div>
      <div class="aviso erro" id="erro-senha" hidden></div>
      <button class="btn primario" type="button" id="btn-salvar-senha">Salvar nova senha</button>
    </div>
  </form>
</dialog>
<div class="toast" id="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
