name: atualizar-obras

# A cada 4 dias: baixa o CNO da Receita, filtra o Pará e atualiza o banco (Supabase).
# Também roda quando a estrutura do banco ou a carga mudam, e manualmente
# (aba Actions > atualizar-obras > Run workflow).
#
# Precisa do segredo SUPABASE_DB_URL (Settings > Secrets and variables > Actions).

on:
  schedule:
    - cron: "17 9 */4 * *"   # 06:17 em Brasília, dias 1, 5, 9... de cada mês
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/atualizar-obras.yml"
      - "pipeline/carregar_supabase.py"
      - "pipeline/regras.py"
      - "supabase/**"

permissions:
  contents: read

concurrency:
  group: atualizar-obras
  cancel-in-progress: false

env:
  TOKEN_CNO: "PC6732BXG9B98W3"   # link público da Receita com o cno.zip
  UF: "PA"

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Conferir configuração
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Falta o segredo SUPABASE_DB_URL nas configurações do repositório."
            exit 1
          fi
          pip install -q duckdb==1.1.3 "psycopg[binary]==3.2.3"
          psql --version

      - name: Aplicar estrutura do banco
        run: bash supabase/aplicar_migracoes.sh

      - name: Baixar CNO da Receita
        run: python pipeline/baixar_receita.py "$RUNNER_TEMP/cno" "$RUNNER_TEMP/manifesto.json" "$TOKEN_CNO"

      - name: Carregar obras no banco
        run: python pipeline/carregar_supabase.py "$RUNNER_TEMP/cno" --uf "$UF" --manifesto "$RUNNER_TEMP/manifesto.json"
