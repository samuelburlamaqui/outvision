name: baixar-mapas

# Baixa do IBGE as malhas dos municípios do Pará e salva em dados/mapas/:
# - shapefile oficial (PA_Municipios_<ano>.zip), para uso em programas de mapa (QGIS etc.)
# - GeoJSON com nome, mesorregião, microrregião, região intermediária e imediata de cada município
#   (versão detalhada e versão leve para o site)
# - GeoJSON das 6 mesorregiões (Baixo Amazonas, Marajó, Metropolitana de Belém, Nordeste,
#   Sudeste e Sudoeste Paraense)
# Roda manualmente (aba Actions > baixar-mapas > Run workflow) ou quando este arquivo muda.

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/baixar-mapas.yml"

permissions:
  contents: write

jobs:
  mapas:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Shapefile oficial dos municípios do Pará
        continue-on-error: true
        run: |
          mkdir -p dados/mapas
          base="https://geoftp.ibge.gov.br/organizacao_do_territorio/malhas_territoriais/malhas_municipais"
          for ano in 2025 2024 2023 2022; do
            if curl -fsSL --retry 3 --retry-delay 10 -o "dados/mapas/PA_Municipios_${ano}.zip" "$base/municipio_${ano}/UFs/PA/PA_Municipios_${ano}.zip"; then
              echo "Shapefile da malha $ano baixado"; ls -la dados/mapas; break
            else
              rm -f "dados/mapas/PA_Municipios_${ano}.zip"; echo "malha $ano não encontrada"
            fi
          done

      - name: GeoJSON com nomes e regiões
        run: |
          mkdir -p dados/mapas site/mapas
          api="https://servicodados.ibge.gov.br/api"
          curl -fsSL --retry 3 --retry-delay 10 -o "$RUNNER_TEMP/detalhada.json" "$api/v3/malhas/estados/15?formato=application/vnd.geo%2Bjson&qualidade=intermediaria&intrarregiao=municipio"
          curl -fsSL --retry 3 --retry-delay 10 -o "$RUNNER_TEMP/leve.json" "$api/v3/malhas/estados/15?formato=application/vnd.geo%2Bjson&qualidade=minima&intrarregiao=municipio"
          curl -fsSL --retry 3 --retry-delay 10 -o "$RUNNER_TEMP/nomes.json" "$api/v1/localidades/estados/15/municipios"
          curl -fsSL --retry 3 --retry-delay 10 -o "$RUNNER_TEMP/meso_detalhada.json" "$api/v3/malhas/estados/15?formato=application/vnd.geo%2Bjson&qualidade=intermediaria&intrarregiao=mesorregiao"
          curl -fsSL --retry 3 --retry-delay 10 -o "$RUNNER_TEMP/meso_leve.json" "$api/v3/malhas/estados/15?formato=application/vnd.geo%2Bjson&qualidade=minima&intrarregiao=mesorregiao"
          curl -fsSL --retry 3 --retry-delay 10 -o "$RUNNER_TEMP/meso_nomes.json" "$api/v1/localidades/estados/15/mesorregioes"
          python3 - "$RUNNER_TEMP" <<'PY'
          import json, sys
          tmp = sys.argv[1]
          nomes = {}
          for m in json.load(open(f"{tmp}/nomes.json", encoding="utf-8")):
              ri = (m.get("regiao-imediata") or {})
              mi = (m.get("microrregiao") or {})
              nomes[str(m["id"])] = {
                  "codigo_ibge": str(m["id"]),
                  "nome": m["nome"],
                  "mesorregiao": (mi.get("mesorregiao") or {}).get("nome"),
                  "microrregiao": mi.get("nome"),
                  "regiao_imediata": ri.get("nome"),
                  "regiao_intermediaria": (ri.get("regiao-intermediaria") or {}).get("nome"),
              }
          def arred(c):
              return [arred(x) for x in c] if isinstance(c[0], list) else [round(c[0], 4), round(c[1], 4)]
          for origem, destino in (("detalhada", "dados/mapas/pa_municipios.geojson"), ("leve", "site/mapas/pa_municipios.geojson")):
              g = json.load(open(f"{tmp}/{origem}.json", encoding="utf-8"))
              for f in g["features"]:
                  cod = str(f["properties"].get("codarea"))
                  f["properties"] = nomes.get(cod, {"codigo_ibge": cod, "nome": None})
                  f["geometry"]["coordinates"] = arred(f["geometry"]["coordinates"])
              json.dump(g, open(destino, "w", encoding="utf-8"), ensure_ascii=False, separators=(",", ":"))
              sem = [f["properties"]["codigo_ibge"] for f in g["features"] if not f["properties"].get("nome")]
              print(f"{destino}: {len(g['features'])} municípios; sem nome: {sem}")
          meso = {str(m["id"]): m["nome"] for m in json.load(open(f"{tmp}/meso_nomes.json", encoding="utf-8"))}
          for origem, destino in (("meso_detalhada", "dados/mapas/pa_mesorregioes.geojson"), ("meso_leve", "site/mapas/pa_mesorregioes.geojson")):
              g = json.load(open(f"{tmp}/{origem}.json", encoding="utf-8"))
              for f in g["features"]:
                  cod = str(f["properties"].get("codarea"))
                  f["properties"] = {"codigo_ibge": cod, "nome": meso.get(cod)}
                  f["geometry"]["coordinates"] = arred(f["geometry"]["coordinates"])
              json.dump(g, open(destino, "w", encoding="utf-8"), ensure_ascii=False, separators=(",", ":"))
              print(f"{destino}: {[f['properties']['nome'] for f in g['features']]}")
          PY
          ls -la dados/mapas site/mapas

      - name: Salvar no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados/mapas site/mapas
          if git diff --cached --quiet; then echo "Nada novo"; exit 0; fi
          git commit -m "Mapas do Pará (IBGE): shapefile e GeoJSON dos municípios"
          for i in 1 2 3; do
            git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME" && exit 0
            sleep $((i * 10))
          done
          exit 1
