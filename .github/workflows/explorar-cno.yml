name: explorar-cno

# Baixa os arquivos do CNO (Cadastro Nacional de Obras) da Receita Federal,
# analisa a estrutura dos dados e salva o relatório em exploracao/.
#
# Roda quando o pipeline muda ou manualmente (aba Actions > explorar-cno > Run workflow).

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/explorar-cno.yml"
      - "pipeline/**"

permissions:
  contents: write

concurrency:
  group: explorar-cno-${{ github.ref }}
  cancel-in-progress: false

env:
  # Links públicos da Receita Federal (trecho depois de /index.php/s/)
  TOKENS_RECEITA: "XEa8aE7wJdMGzkE PC6732BXG9B98W3"

jobs:
  explorar:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
          pip install -q duckdb==1.1.3

      - name: Baixar arquivos da Receita
        run: |
          python pipeline/baixar_receita.py "$RUNNER_TEMP/cno" exploracao/manifesto.json $TOKENS_RECEITA

      - name: Explorar dados
        run: |
          python pipeline/explorar_cno.py "$RUNNER_TEMP/cno" exploracao "$RUNNER_TEMP/parquet"
          echo "--- espaço em disco ---"; df -h "$RUNNER_TEMP"
          echo "--- parquet ---"; ls -la "$RUNNER_TEMP/parquet" || true

      - name: Guardar Parquet como artefato (não vai para o git)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: cno-parquet
          path: ${{ runner.temp }}/parquet
          retention-days: 7
          if-no-files-found: warn

      - name: Salvar relatório no repositório
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add exploracao
          if git diff --cached --quiet; then echo "Nada novo para salvar"; exit 0; fi
          git commit -m "Atualiza exploração do CNO"
          for i in 1 2 3; do
            git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME" && exit 0
            sleep $((i * 10))
          done
          exit 1
